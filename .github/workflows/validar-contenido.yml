name: Validar contenido

on:
  pull_request:
    branches: [main]

# Por defecto solo lectura. Únicamente el job de fusión recibe permiso de escritura.
permissions:
  contents: read

jobs:
  validar:
    name: validar-contenido
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Limitar archivos del pull request
        id: archivos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fuera_de_alcance=()
          while IFS= read -r archivo; do
            [[ -z "$archivo" ]] && continue
            if [[ ! "$archivo" =~ ^src/content/paginas/[^/]+\.md$ && ! "$archivo" =~ ^src/assets/editor/[a-z0-9-]+\.webp$ ]]; then
              fuera_de_alcance+=("$archivo")
            fi
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if (( ${#fuera_de_alcance[@]} > 0 )); then
            {
              echo '## ❌ Archivos no permitidos'
              echo 'El pull request solo puede cambiar archivos `.md` de `src/content/paginas/` e imágenes `.webp` de `src/assets/editor/`.'
              printf -- '- `%s`\n' "${fuera_de_alcance[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## ✅ Archivos permitidos' >> "$GITHUB_STEP_SUMMARY"
          echo 'Todos los cambios son contenido de `src/content/paginas/` o imágenes de `src/assets/editor/`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Rechazar HTML en el contenido
        id: html
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          errores=()
          while IFS= read -r archivo; do
            [[ "$archivo" == *.md && -f "$archivo" ]] || continue
            if coincidencias=$(grep -niE '<[[:alpha:]][^>]*>' "$archivo"); then
              errores+=("$archivo: $coincidencias")
            fi
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- src/content/)
          if (( ${#errores[@]} > 0 )); then
            {
              echo '## ❌ Se encontró HTML en el contenido'
              echo 'Usa únicamente texto plano en los archivos Markdown.'
              printf -- '- `%s`\n' "${errores[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## ✅ Contenido sin HTML' >> "$GITHUB_STEP_SUMMARY"
          echo 'Los archivos Markdown modificados no contienen etiquetas HTML.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validar imágenes nuevas
        id: imagenes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          errores=()
          while IFS= read -r archivo; do
            [[ -z "$archivo" ]] && continue
            if [[ "$archivo" != *.webp ]]; then
              errores+=("$archivo: las imágenes nuevas deben estar en formato WebP.")
            elif [[ -f "$archivo" ]]; then
              tipo=$(file --brief --mime-type "$archivo")
              if [[ "$tipo" != image/webp ]]; then
                errores+=("$archivo: el contenido real no es una imagen WebP válida.")
              fi
              bytes=$(wc -c < "$archivo")
              if (( bytes > 409600 )); then
                errores+=("$archivo: pesa $bytes bytes; el máximo permitido es 409600 bytes (400 KB).")
              fi
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- src/assets/editor/)
          if (( ${#errores[@]} > 0 )); then
            {
              echo '## ❌ Imágenes no válidas'
              printf -- '- %s\n' "${errores[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## ✅ Imágenes nuevas válidas' >> "$GITHUB_STEP_SUMMARY"
          echo 'Todas las imágenes nuevas o reemplazadas son WebP y pesan como máximo 400 KB.' >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependencias
        id: instalar
        run: |
          if npm ci; then
            echo '## ✅ Dependencias instaladas' >> "$GITHUB_STEP_SUMMARY"
            echo '`npm ci` terminó correctamente.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ❌ No se pudieron instalar las dependencias' >> "$GITHUB_STEP_SUMMARY"
            echo 'Revisa que `package-lock.json` esté actualizado y que las dependencias sean válidas.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Comprobar tipos y contenido Astro
        id: check
        run: |
          if npx astro check; then
            echo '## ✅ Comprobación Astro' >> "$GITHUB_STEP_SUMMARY"
            echo '`astro check` terminó correctamente.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ❌ Falló la comprobación Astro' >> "$GITHUB_STEP_SUMMARY"
            echo 'Revisa los tipos y el contenido requerido por el esquema.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Compilar sitio estático
        id: build
        run: |
          if npm run build; then
            echo '## ✅ Compilación estática' >> "$GITHUB_STEP_SUMMARY"
            echo '`npm run build` terminó correctamente.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ❌ Falló la compilación estática' >> "$GITHUB_STEP_SUMMARY"
            echo 'Revisa el esquema, las imágenes y la compilación de Astro.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumir pasos fallidos
        if: always()
        env:
          CHECKOUT_RESULTADO: ${{ steps.checkout.outcome }}
          NODE_RESULTADO: ${{ steps.setup_node.outcome }}
          ARCHIVOS_RESULTADO: ${{ steps.archivos.outcome }}
          HTML_RESULTADO: ${{ steps.html.outcome }}
          IMAGENES_RESULTADO: ${{ steps.imagenes.outcome }}
          INSTALAR_RESULTADO: ${{ steps.instalar.outcome }}
          CHECK_RESULTADO: ${{ steps.check.outcome }}
          BUILD_RESULTADO: ${{ steps.build.outcome }}
        run: |
          fallidos=()
          [[ "$CHECKOUT_RESULTADO" == failure ]] && fallidos+=("Descargar repositorio")
          [[ "$NODE_RESULTADO" == failure ]] && fallidos+=("Configurar Node.js")
          [[ "$ARCHIVOS_RESULTADO" == failure ]] && fallidos+=("Limitar archivos del pull request")
          [[ "$HTML_RESULTADO" == failure ]] && fallidos+=("Rechazar HTML en el contenido")
          [[ "$IMAGENES_RESULTADO" == failure ]] && fallidos+=("Validar imágenes nuevas")
          [[ "$INSTALAR_RESULTADO" == failure ]] && fallidos+=("Instalar dependencias")
          [[ "$CHECK_RESULTADO" == failure ]] && fallidos+=("Comprobar tipos y contenido Astro")
          [[ "$BUILD_RESULTADO" == failure ]] && fallidos+=("Compilar sitio estático")
          if (( ${#fallidos[@]} > 0 )); then
            {
              echo '## ❌ Pasos que fallaron'
              printf -- '- %s\n' "${fallidos[@]}"
              echo 'Consulta el registro del paso para ver el detalle y cómo corregirlo.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ✅ Todos los pasos completados' >> "$GITHUB_STEP_SUMMARY"
          fi

  fusionar:
    name: fusion-automatica
    needs: validar
    if: startsWith(github.event.pull_request.head.ref, 'cambios/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Fusionar y lanzar el despliegue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # La validación ya pasó (needs: validar), así que se fusiona de una vez.
          if ! gh pr merge --squash --delete-branch "$PR_URL"; then
            echo '## ❌ No se pudo fusionar' >> "$GITHUB_STEP_SUMMARY"
            echo 'Comprueba el ruleset de `main` y que el pull request no tenga conflictos.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## ✅ Fusionado' >> "$GITHUB_STEP_SUMMARY"
          # Una fusión con GITHUB_TOKEN no dispara push; el despliegue se lanza a mano.
          gh workflow run desplegar.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo '## ✅ Despliegue lanzado' >> "$GITHUB_STEP_SUMMARY"

  rechazar:
    name: rechazo-automatico
    needs: validar
    if: failure() && startsWith(github.event.pull_request.head.ref, 'cambios/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Cerrar el envío rechazado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --delete-branch --comment 'Cambios rechazados automáticamente: no pasaron la validación de contenido.'
          echo '## ❌ Envío rechazado y cerrado' >> "$GITHUB_STEP_SUMMARY"
