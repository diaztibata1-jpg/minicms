name = "agenda"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
NEGOCIO = "Barbería de prueba"
# Celular de 10 dígitos para el botón de WhatsApp de la página pública.
WHATSAPP = "3000000000"
# Cada cuántos minutos empieza un horario posible.
INTERVALO_MIN = "30"
# Cuántos días hacia adelante muestra la página pública.
DIAS_VISIBLES = "14"
# Máximo de profesionales activos.
MAX_PROFESIONALES = "3"

# Copia diaria de la base a Google Drive a las 3 a. m. de Bogotá (8:00 UTC).
[triggers]
crons = ["0 8 * * *"]

# Registros de errores visibles en el panel de Cloudflare (Workers > agenda > Logs).
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "agenda"
# En local no importa. Para publicar: wrangler d1 create agenda y pega aquí el id.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migraciones"

# Demo pública con datos de ejemplo y SIN contraseña: npm run demo:desplegar.
# Nunca cargar datos reales aquí; cualquiera con el link entra al panel.
[env.demo]
name = "agenda-demo"
triggers = { crons = [] }

[env.demo.vars]
NEGOCIO = "Barbería de prueba"
WHATSAPP = "3000000000"
INTERVALO_MIN = "30"
DIAS_VISIBLES = "14"
MAX_PROFESIONALES = "3"
SIN_CONTRASENA = "1"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "agenda-demo"
# wrangler d1 create agenda-demo y pega aquí el id.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migraciones"
